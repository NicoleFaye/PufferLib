[base]
env_name = pokemon_pinball
package = pokemon_pinball 

[train]
# Environment setup
num_envs = 128
num_workers = 32
env_batch_size = 32
zero_copy = False

# Training hyperparameters
total_timesteps = 10_000_000
batch_size = 32768
minibatch_size = 8192
bptt_horizon = 16
learning_rate = 0.0003
gamma = 0.998
gae_lambda = 0.95
update_epochs = 4
clip_coef = 0.2
ent_coef = 0.01
vf_coef = 0.5
vf_clip_coef = 0.1
max_grad_norm = 0.5
norm_adv = True
clip_vloss = True
target_kl = None
anneal_lr = False

[wandb]
project = pokemon-pinball-pufferlib
group = experiments
track = True

[sweep]
method = bayes
name = sweep_updated_reward

[sweep.metric]
goal = maximize
name = environment/episode_return

[sweep.parameters.train.parameters.learning_rate]
distribution = log_uniform_values
min = 1e-5
max = 1e-3

[sweep.parameters.train.parameters.gamma]
distribution = uniform
min = 0.95
max = 0.999

[sweep.parameters.train.parameters.gae_lambda]
distribution = uniform
min = 0.8
max = 1.0

[sweep.parameters.train.parameters.update_epochs]
distribution = int_uniform
min = 1
max = 4

[sweep.parameters.train.parameters.vf_coef]
distribution = uniform
min = 0.1
max = 1.0

[sweep.parameters.train.parameters.max_grad_norm]
distribution = uniform
min = 0.1
max = 1.0

[sweep.parameters.train.parameters.ent_coef]
distribution = log_uniform_values
min = 1e-5
max = 1e-2

[sweep.parameters.train.parameters.bptt_horizon]
values = [1, 2, 4, 8, 16, 32, 64]